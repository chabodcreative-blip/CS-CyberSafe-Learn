services:
  - type: web
    plan: starter
    name: cs-cybersafe-learn
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cs-cybersafe-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPLOAD_FOLDER
        value: /opt/render/project/src/app/static/uploads
    disk:
      name: cs-cybersafe-uploads
      mountPath: /opt/render/project/src/app/static/uploads
      sizeGB: 1

databases:
  - name: cs-cybersafe-db
    plan: basic-256mb
    databaseName: cybersafe
    user: cybersafe
