{% extends 'base.html' %}{% block title %}Knowledge Check Question · Administration{% endblock %}{% block content %}<section class="admin-shell"><div class="container"><div class="eyebrow">KNOWLEDGE CHECK EDITOR</div><h1>{{'Edit' if question.id else 'Add'}} question</h1><form method="post" class="admin-panel mt-4"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label class="form-label">Lesson</label><select class="form-select mb-3" name="lesson_id" required>{% for l in lessons %}<option value="{{l.id}}" {% if question.lesson_id==l.id %}selected{% endif %}>{{l.topic.title}} — {{l.title}}</option>{% endfor %}</select><label class="form-label">Question</label><textarea class="form-control mb-3" name="question" rows="3" required>{{question.question or ''}}</textarea>{% for i in range(4) %}<label class="form-label">Option {{i+1}}</label><input class="form-control mb-2" name="option_{{i}}" value="{{options[i]}}" required>{% endfor %}<label class="form-label mt-2">Correct option</label><select class="form-select mb-3" name="correct_index">{% for i in range(4) %}<option value="{{i}}" {% if question.correct_index==i %}selected{% endif %}>Option {{i+1}}</option>{% endfor %}</select><label class="form-label">Explanation shown after submission</label><textarea class="form-control" name="explanation" rows="4">{{question.explanation or ''}}</textarea><button class="btn btn-primary mt-4">Save question</button></form></div></section>{% endblock %}
