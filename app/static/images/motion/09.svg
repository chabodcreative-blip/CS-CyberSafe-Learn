<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Safe internet browsing</title><desc id="d">The address bar is inspected before credentials are entered.</desc><style>
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes slide{0%{transform:translateX(-30px);opacity:.2}18%,78%{transform:translateX(0);opacity:1}100%{transform:translateX(30px);opacity:.2}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.2}50%{opacity:.85}}
@keyframes scan{0%{transform:translateX(0)}50%{transform:translateX(260px)}100%{transform:translateX(0)}}
@keyframes fill{0%{width:18px}55%{width:210px}100%{width:18px}}
@keyframes swap{0%,20%{transform:translateX(0)}45%,70%{transform:translateX(55px)}100%{transform:translateX(0)}}
@keyframes appear{0%,25%{opacity:0;transform:translateY(10px)}45%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes blink{0%,45%,100%{opacity:.35}55%,85%{opacity:1}}
@keyframes ring{0%{transform:scale(.7);opacity:.7}70%,100%{transform:scale(1.45);opacity:0}}
</style><rect width="900" height="520" rx="30" fill="#f8f5f3"/><circle cx="760" cy="70" r="150" fill="#eee6e9"/><circle cx="120" cy="470" r="180" fill="#f0e7eb"/><text x="55" y="105" fill="#252329" font-family="Arial" font-size="34" font-weight="700">Look at the address, not just the page.</text><text x="55" y="135" fill="#706c73" font-family="Arial" font-size="16">A familiar logo cannot prove that a destination is genuine.</text><g transform="translate(65 185)"><rect width="770" height="240" rx="22" fill="white" stroke="#e4dcdf"/><rect x="25" y="25" width="720" height="52" rx="13" fill="#f8f5f3"/><circle cx="52" cy="51" r="9" fill="#5a0f1b"/><text x="78" y="57" font-family="Arial" font-size="16" fill="#252329">https://bank-login.example</text><rect x="25" y="105" width="720" height="105" rx="14" fill="#eee6e9"/><text x="60" y="145" font-family="Arial" font-size="22" font-weight="700" fill="#252329">Sign in to continue</text><text x="60" y="176" font-family="Arial" font-size="13" fill="#706c73">Check the domain before entering credentials.</text><rect x="78" y="45" width="160" height="5" rx="2" fill="#8f1725" style="animation:scan 3s infinite"/></g><text x="55" y="64" fill="#8f1725" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">CS CYBERSAFE LEARN</text></svg>