<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Password security</title><desc id="d">The same credential is replaced with separate credentials across important accounts.</desc><style>
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes slide{0%{transform:translateX(-30px);opacity:.2}18%,78%{transform:translateX(0);opacity:1}100%{transform:translateX(30px);opacity:.2}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.2}50%{opacity:.85}}
@keyframes scan{0%{transform:translateX(0)}50%{transform:translateX(260px)}100%{transform:translateX(0)}}
@keyframes fill{0%{width:18px}55%{width:210px}100%{width:18px}}
@keyframes swap{0%,20%{transform:translateX(0)}45%,70%{transform:translateX(55px)}100%{transform:translateX(0)}}
@keyframes appear{0%,25%{opacity:0;transform:translateY(10px)}45%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes blink{0%,45%,100%{opacity:.35}55%,85%{opacity:1}}
@keyframes ring{0%{transform:scale(.7);opacity:.7}70%,100%{transform:scale(1.45);opacity:0}}
</style><rect width="900" height="520" rx="30" fill="#f8f5f3"/><circle cx="760" cy="70" r="150" fill="#eee6e9"/><circle cx="120" cy="470" r="180" fill="#f0e7eb"/><text x="55" y="105" fill="#252329" font-family="Arial" font-size="34" font-weight="700">One reused password can travel.</text><text x="55" y="135" fill="#706c73" font-family="Arial" font-size="16">Separate important accounts so one breach does not unlock another.</text><g transform="translate(60 190)"><rect width="300" height="235" rx="22" fill="white" stroke="#e4dcdf"/><text x="25" y="40" font-family="Arial" font-size="13" fill="#706c73">Before</text><g font-family="Arial" font-size="13" fill="#252329"><rect x="25" y="65" width="250" height="42" rx="12" fill="#f8f5f3"/><text x="42" y="91">Email</text><text x="205" y="91" fill="#8f1725">••••••</text><rect x="25" y="120" width="250" height="42" rx="12" fill="#f8f5f3"/><text x="42" y="146">Shopping</text><text x="205" y="146" fill="#8f1725">••••••</text><rect x="25" y="175" width="250" height="42" rx="12" fill="#f8f5f3"/><text x="42" y="201">Banking</text><text x="205" y="201" fill="#8f1725">••••••</text></g></g><path d="M390 305H500" stroke="#c9bdc2" stroke-width="5"/><circle cx="410" cy="305" r="10" fill="#8f1725" style="animation:slide 3s infinite"/><g transform="translate(535 190)"><rect width="300" height="235" rx="22" fill="#5a0f1b"/><text x="25" y="40" font-family="Arial" font-size="13" fill="#e8d5d9">After</text><g font-family="Arial" font-size="13"><rect x="25" y="65" width="250" height="42" rx="12" fill="#fff"/><text x="42" y="91">Email</text><text x="195" y="91" fill="#4b2a63">unique</text><rect x="25" y="120" width="250" height="42" rx="12" fill="#fff"/><text x="42" y="146">Shopping</text><text x="195" y="146" fill="#4b2a63">unique</text><rect x="25" y="175" width="250" height="42" rx="12" fill="#fff"/><text x="42" y="201">Banking</text><text x="195" y="201" fill="#4b2a63">unique</text></g></g><text x="55" y="64" fill="#8f1725" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">CS CYBERSAFE LEARN</text></svg>