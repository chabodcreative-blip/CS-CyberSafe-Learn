<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Online scam pressure</title><desc id="d">A tempting prize becomes urgent; the learner pauses before paying.</desc><style>
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes slide{0%{transform:translateX(-30px);opacity:.2}18%,78%{transform:translateX(0);opacity:1}100%{transform:translateX(30px);opacity:.2}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.2}50%{opacity:.85}}
@keyframes scan{0%{transform:translateX(0)}50%{transform:translateX(260px)}100%{transform:translateX(0)}}
@keyframes fill{0%{width:18px}55%{width:210px}100%{width:18px}}
@keyframes swap{0%,20%{transform:translateX(0)}45%,70%{transform:translateX(55px)}100%{transform:translateX(0)}}
@keyframes appear{0%,25%{opacity:0;transform:translateY(10px)}45%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes blink{0%,45%,100%{opacity:.35}55%,85%{opacity:1}}
@keyframes ring{0%{transform:scale(.7);opacity:.7}70%,100%{transform:scale(1.45);opacity:0}}
</style><rect width="900" height="520" rx="30" fill="#f8f5f3"/><circle cx="760" cy="70" r="150" fill="#eee6e9"/><circle cx="120" cy="470" r="180" fill="#f0e7eb"/><text x="55" y="105" fill="#252329" font-family="Arial" font-size="34" font-weight="700">Pressure is part of the trick.</text><text x="55" y="135" fill="#706c73" font-family="Arial" font-size="16">Slow the decision down before money or information moves.</text><g transform="translate(70 195)"><rect width="250" height="190" rx="20" fill="white" stroke="#e4dcdf"/><circle cx="125" cy="62" r="35" fill="#eee6e9"/><text x="125" y="68" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#5a0f1b">$</text><text x="125" y="125" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#252329">YOU WON!</text><text x="125" y="151" text-anchor="middle" font-family="Arial" font-size="12" fill="#706c73">Claim fee required</text></g><path d="M350 290H515" stroke="#8f1725" stroke-width="6" stroke-dasharray="14 12"/><text x="350" y="260" font-family="Arial" font-size="13" fill="#8f1725" font-weight="700">URGENT</text><g transform="translate(560 190)"><rect width="270" height="200" rx="22" fill="#4b2a63"/><circle cx="65" cy="70" r="28" fill="#8f1725" style="animation:ring 2s infinite"/><circle cx="65" cy="70" r="15" fill="#8f1725"/><text x="110" y="75" font-family="Arial" font-size="18" font-weight="700" fill="white">STOP</text><text x="30" y="125" font-family="Arial" font-size="14" fill="#e8dff0">Verify the offer</text><text x="30" y="151" font-family="Arial" font-size="14" fill="#e8dff0">before sending anything.</text></g><text x="55" y="64" fill="#8f1725" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">CS CYBERSAFE LEARN</text></svg>