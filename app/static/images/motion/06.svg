<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Social media safety</title><desc id="d">A post audience changes from public to a more limited audience before sharing.</desc><style>
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes slide{0%{transform:translateX(-30px);opacity:.2}18%,78%{transform:translateX(0);opacity:1}100%{transform:translateX(30px);opacity:.2}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.2}50%{opacity:.85}}
@keyframes scan{0%{transform:translateX(0)}50%{transform:translateX(260px)}100%{transform:translateX(0)}}
@keyframes fill{0%{width:18px}55%{width:210px}100%{width:18px}}
@keyframes swap{0%,20%{transform:translateX(0)}45%,70%{transform:translateX(55px)}100%{transform:translateX(0)}}
@keyframes appear{0%,25%{opacity:0;transform:translateY(10px)}45%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes blink{0%,45%,100%{opacity:.35}55%,85%{opacity:1}}
@keyframes ring{0%{transform:scale(.7);opacity:.7}70%,100%{transform:scale(1.45);opacity:0}}
</style><rect width="900" height="520" rx="30" fill="#f8f5f3"/><circle cx="760" cy="70" r="150" fill="#eee6e9"/><circle cx="120" cy="470" r="180" fill="#f0e7eb"/><text x="55" y="105" fill="#252329" font-family="Arial" font-size="34" font-weight="700">Who can see the post?</text><text x="55" y="135" fill="#706c73" font-family="Arial" font-size="16">A privacy choice changes the audience before the post goes live.</text><g transform="translate(75 190)"><rect width="380" height="235" rx="22" fill="white" stroke="#e4dcdf"/><rect x="24" y="24" width="332" height="105" rx="15" fill="#eee6e9"/><circle cx="90" cy="75" r="28" fill="#b48d94"/><rect x="130" y="55" width="160" height="12" rx="6" fill="#d0c0c4"/><rect x="130" y="78" width="120" height="10" rx="5" fill="#d0c0c4"/><text x="25" y="165" font-family="Arial" font-size="13" fill="#706c73">Audience</text><text x="25" y="195" font-family="Arial" font-size="18" font-weight="700" fill="#252329">Everyone</text><circle cx="310" cy="190" r="22" fill="#8f1725" style="animation:pulse 2.4s infinite"/></g><g transform="translate(520 205)"><text x="0" y="0" font-family="Arial" font-size="14" font-weight="700" fill="#4b2a63">REVIEW BEFORE POSTING</text><rect x="0" y="35" width="285" height="10" rx="5" fill="#e3dadd"/><circle cx="275" cy="40" r="14" fill="#8f1725" style="animation:swap 3s infinite"/><text x="0" y="82" font-family="Arial" font-size="15" fill="#706c73">Everyone</text><text x="190" y="82" font-family="Arial" font-size="15" font-weight="700" fill="#5a0f1b">Friends</text><path d="M145 120l14 14 30-35" stroke="#5a0f1b" stroke-width="7" fill="none"/></g><text x="55" y="64" fill="#8f1725" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">CS CYBERSAFE LEARN</text></svg>