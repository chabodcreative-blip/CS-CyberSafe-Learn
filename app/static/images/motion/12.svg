<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Two-factor authentication</title><desc id="d">A second factor protects the account, but its code must remain private.</desc><style>
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes slide{0%{transform:translateX(-30px);opacity:.2}18%,78%{transform:translateX(0);opacity:1}100%{transform:translateX(30px);opacity:.2}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.2}50%{opacity:.85}}
@keyframes scan{0%{transform:translateX(0)}50%{transform:translateX(260px)}100%{transform:translateX(0)}}
@keyframes fill{0%{width:18px}55%{width:210px}100%{width:18px}}
@keyframes swap{0%,20%{transform:translateX(0)}45%,70%{transform:translateX(55px)}100%{transform:translateX(0)}}
@keyframes appear{0%,25%{opacity:0;transform:translateY(10px)}45%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes blink{0%,45%,100%{opacity:.35}55%,85%{opacity:1}}
@keyframes ring{0%{transform:scale(.7);opacity:.7}70%,100%{transform:scale(1.45);opacity:0}}
</style><rect width="900" height="520" rx="30" fill="#f8f5f3"/><circle cx="760" cy="70" r="150" fill="#eee6e9"/><circle cx="120" cy="470" r="180" fill="#f0e7eb"/><text x="55" y="105" fill="#252329" font-family="Arial" font-size="34" font-weight="700">The second factor is yours.</text><text x="55" y="135" fill="#706c73" font-family="Arial" font-size="16">A code or approval should never be handed to someone who asks for it.</text><g transform="translate(65 190)"><rect width="360" height="230" rx="22" fill="white" stroke="#e4dcdf"/><text x="28" y="38" font-family="Arial" font-size="13" fill="#706c73">Sign in</text><text x="28" y="78" font-family="Arial" font-size="17" font-weight="700" fill="#252329">Password accepted</text><rect x="28" y="100" width="304" height="58" rx="14" fill="#f8f5f3"/><text x="50" y="135" font-family="Arial" font-size="13" fill="#706c73">One-time code</text><text x="255" y="137" font-family="Arial" font-size="18" font-weight="700" fill="#4b2a63">••••••</text><circle cx="305" cy="188" r="12" fill="#8f1725" style="animation:pulse 2s infinite"/></g><g transform="translate(500 195)"><circle cx="95" cy="90" r="72" fill="#eee6e9"/><circle cx="95" cy="90" r="45" fill="#4b2a63"/><path d="M72 92l17 18 34-40" stroke="white" stroke-width="9" fill="none"/><text x="0" y="190" font-family="Arial" font-size="15" font-weight="700" fill="#8f1725">Caller asks for the code?</text><text x="0" y="218" font-family="Arial" font-size="14" fill="#706c73">Don't share it. End the request.</text></g><text x="55" y="64" fill="#8f1725" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">CS CYBERSAFE LEARN</text></svg>