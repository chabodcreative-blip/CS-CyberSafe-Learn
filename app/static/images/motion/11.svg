<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Cyberbullying response</title><desc id="d">Harmful messages appear, then the learner moves toward preserving evidence and seeking support.</desc><style>
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes slide{0%{transform:translateX(-30px);opacity:.2}18%,78%{transform:translateX(0);opacity:1}100%{transform:translateX(30px);opacity:.2}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.2}50%{opacity:.85}}
@keyframes scan{0%{transform:translateX(0)}50%{transform:translateX(260px)}100%{transform:translateX(0)}}
@keyframes fill{0%{width:18px}55%{width:210px}100%{width:18px}}
@keyframes swap{0%,20%{transform:translateX(0)}45%,70%{transform:translateX(55px)}100%{transform:translateX(0)}}
@keyframes appear{0%,25%{opacity:0;transform:translateY(10px)}45%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes blink{0%,45%,100%{opacity:.35}55%,85%{opacity:1}}
@keyframes ring{0%{transform:scale(.7);opacity:.7}70%,100%{transform:scale(1.45);opacity:0}}
</style><rect width="900" height="520" rx="30" fill="#f8f5f3"/><circle cx="760" cy="70" r="150" fill="#eee6e9"/><circle cx="120" cy="470" r="180" fill="#f0e7eb"/><text x="55" y="105" fill="#252329" font-family="Arial" font-size="34" font-weight="700">You do not have to answer harm with harm.</text><text x="55" y="135" fill="#706c73" font-family="Arial" font-size="16">Keep useful evidence, protect yourself and use support.</text><g transform="translate(65 180)"><rect width="430" height="250" rx="22" fill="white" stroke="#e4dcdf"/><text x="28" y="38" font-family="Arial" font-size="13" fill="#706c73">Group chat</text><g font-family="Arial" font-size="13"><rect x="28" y="62" width="220" height="42" rx="18" fill="#f0e8ea"/><text x="48" y="88" fill="#252329">Look at this.</text><rect x="90" y="116" width="300" height="42" rx="18" fill="#f4e1e4"/><text x="110" y="142" fill="#8f1725">Everyone should see this.</text><rect x="28" y="170" width="190" height="42" rx="18" fill="#eee6e9"/><text x="48" y="196" fill="#252329">Please stop.</text></g></g><g transform="translate(560 210)"><rect width="270" height="175" rx="22" fill="#5a0f1b"/><text x="25" y="38" font-family="Arial" font-size="13" fill="#e8d5d9">SAFER RESPONSE</text><text x="25" y="75" font-family="Arial" font-size="15" font-weight="700" fill="white">1  Save evidence</text><text x="25" y="105" font-family="Arial" font-size="15" font-weight="700" fill="white">2  Block / report</text><text x="25" y="135" font-family="Arial" font-size="15" font-weight="700" fill="white">3  Seek support</text><circle cx="232" cy="135" r="9" fill="#8f1725" style="animation:pulse 2s infinite"/></g><text x="55" y="64" fill="#8f1725" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">CS CYBERSAFE LEARN</text></svg>