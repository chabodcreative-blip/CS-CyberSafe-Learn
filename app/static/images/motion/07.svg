<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Personal information protection</title><desc id="d">A form asks for more information than the task requires; the learner questions the request.</desc><style>
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes slide{0%{transform:translateX(-30px);opacity:.2}18%,78%{transform:translateX(0);opacity:1}100%{transform:translateX(30px);opacity:.2}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.2}50%{opacity:.85}}
@keyframes scan{0%{transform:translateX(0)}50%{transform:translateX(260px)}100%{transform:translateX(0)}}
@keyframes fill{0%{width:18px}55%{width:210px}100%{width:18px}}
@keyframes swap{0%,20%{transform:translateX(0)}45%,70%{transform:translateX(55px)}100%{transform:translateX(0)}}
@keyframes appear{0%,25%{opacity:0;transform:translateY(10px)}45%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes blink{0%,45%,100%{opacity:.35}55%,85%{opacity:1}}
@keyframes ring{0%{transform:scale(.7);opacity:.7}70%,100%{transform:scale(1.45);opacity:0}}
</style><rect width="900" height="520" rx="30" fill="#f8f5f3"/><circle cx="760" cy="70" r="150" fill="#eee6e9"/><circle cx="120" cy="470" r="180" fill="#f0e7eb"/><text x="55" y="105" fill="#252329" font-family="Arial" font-size="34" font-weight="700">Not every field needs an answer.</text><text x="55" y="135" fill="#706c73" font-family="Arial" font-size="16">Ask what the information is for before sharing it.</text><g transform="translate(70 180)"><rect width="350" height="255" rx="22" fill="white" stroke="#e4dcdf"/><text x="28" y="38" font-family="Arial" font-size="13" fill="#706c73">Online form</text><g font-family="Arial" font-size="12"><text x="28" y="75" fill="#252329">Name</text><rect x="28" y="84" width="290" height="30" rx="8" fill="#f8f5f3"/><text x="28" y="140" fill="#252329">Email</text><rect x="28" y="149" width="290" height="30" rx="8" fill="#f8f5f3"/><text x="28" y="205" fill="#8f1725" font-weight="700">Bank PIN?</text><rect x="28" y="214" width="290" height="30" rx="8" fill="#f4e1e4"/></g></g><g transform="translate(500 210)"><circle cx="70" cy="70" r="50" fill="#eee6e9"/><text x="70" y="78" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#8f1725">?</text><text x="0" y="150" font-family="Arial" font-size="16" font-weight="700" fill="#252329">Why is it needed?</text><text x="0" y="178" font-family="Arial" font-size="14" fill="#706c73">If the purpose is unclear,</text><text x="0" y="200" font-family="Arial" font-size="14" fill="#706c73">don't share it automatically.</text></g><text x="55" y="64" fill="#8f1725" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">CS CYBERSAFE LEARN</text></svg>