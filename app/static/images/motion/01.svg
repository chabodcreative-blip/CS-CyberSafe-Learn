<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Cyber safety foundations</title><desc id="d">Animated four-step pause, check, verify and act routine.</desc><style>
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes slide{0%{transform:translateX(-30px);opacity:.2}18%,78%{transform:translateX(0);opacity:1}100%{transform:translateX(30px);opacity:.2}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.2}50%{opacity:.85}}
@keyframes scan{0%{transform:translateX(0)}50%{transform:translateX(260px)}100%{transform:translateX(0)}}
@keyframes fill{0%{width:18px}55%{width:210px}100%{width:18px}}
@keyframes swap{0%,20%{transform:translateX(0)}45%,70%{transform:translateX(55px)}100%{transform:translateX(0)}}
@keyframes appear{0%,25%{opacity:0;transform:translateY(10px)}45%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes blink{0%,45%,100%{opacity:.35}55%,85%{opacity:1}}
@keyframes ring{0%{transform:scale(.7);opacity:.7}70%,100%{transform:scale(1.45);opacity:0}}
</style><rect width="900" height="520" rx="30" fill="#f8f5f3"/><circle cx="760" cy="70" r="150" fill="#eee6e9"/><circle cx="120" cy="470" r="180" fill="#f0e7eb"/><text x="55" y="105" fill="#252329" font-family="Arial" font-size="34" font-weight="700">Pause before you act.</text><text x="55" y="135" fill="#706c73" font-family="Arial" font-size="16">A safer decision can happen in seconds.</text><g font-family="Arial" font-weight="700" font-size="16"><g transform="translate(70 220)"><circle cx="55" cy="55" r="48" fill="#5a0f1b"/><text x="55" y="61" fill="white" text-anchor="middle">1</text><text x="55" y="92" fill="#252329" text-anchor="middle">PAUSE</text></g><g transform="translate(260 220)"><circle cx="55" cy="55" r="48" fill="#4b2a63"/><text x="55" y="61" fill="white" text-anchor="middle">2</text><text x="55" y="92" fill="#252329" text-anchor="middle">CHECK</text></g><g transform="translate(450 220)"><circle cx="55" cy="55" r="48" fill="#8f1725"/><text x="55" y="61" fill="white" text-anchor="middle">3</text><text x="55" y="92" fill="#252329" text-anchor="middle">VERIFY</text></g><g transform="translate(640 220)"><circle cx="55" cy="55" r="48" fill="#252329"/><text x="55" y="61" fill="white" text-anchor="middle">4</text><text x="55" y="92" fill="#252329" text-anchor="middle">ACT</text></g></g><path d="M180 275H250M370 275H440M560 275H630" stroke="#c8b9bf" stroke-width="4"/><circle cx="160" cy="275" r="7" fill="#8f1725"><animate attributeName="cx" values="160;350;540;730;160" dur="6s" repeatCount="indefinite"/></circle><rect x="55" y="385" width="790" height="70" rx="18" fill="white" stroke="#e4dcdf"/><text x="80" y="428" fill="#706c73" font-family="Arial" font-size="16">Unexpected request?</text><text x="260" y="428" fill="#5a0f1b" font-family="Arial" font-size="16" font-weight="700">Slow down. Your next decision matters.</text><text x="55" y="64" fill="#8f1725" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">CS CYBERSAFE LEARN</text></svg>