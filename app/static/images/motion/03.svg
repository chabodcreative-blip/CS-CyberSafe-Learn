<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Phishing detection</title><desc id="d">An email is inspected, its destination is questioned, and the trusted route is chosen.</desc><style>
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes slide{0%{transform:translateX(-30px);opacity:.2}18%,78%{transform:translateX(0);opacity:1}100%{transform:translateX(30px);opacity:.2}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.2}50%{opacity:.85}}
@keyframes scan{0%{transform:translateX(0)}50%{transform:translateX(260px)}100%{transform:translateX(0)}}
@keyframes fill{0%{width:18px}55%{width:210px}100%{width:18px}}
@keyframes swap{0%,20%{transform:translateX(0)}45%,70%{transform:translateX(55px)}100%{transform:translateX(0)}}
@keyframes appear{0%,25%{opacity:0;transform:translateY(10px)}45%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes blink{0%,45%,100%{opacity:.35}55%,85%{opacity:1}}
@keyframes ring{0%{transform:scale(.7);opacity:.7}70%,100%{transform:scale(1.45);opacity:0}}
</style><rect width="900" height="520" rx="30" fill="#f8f5f3"/><circle cx="760" cy="70" r="150" fill="#eee6e9"/><circle cx="120" cy="470" r="180" fill="#f0e7eb"/><text x="55" y="105" fill="#252329" font-family="Arial" font-size="34" font-weight="700">A message can look convincing.</text><text x="55" y="135" fill="#706c73" font-family="Arial" font-size="16">The safer habit is to inspect the route, not the appearance.</text><g transform="translate(60 185)"><rect width="300" height="230" rx="22" fill="white" stroke="#e4dcdf"/><text x="24" y="35" font-family="Arial" font-size="13" fill="#706c73">Inbox</text><rect x="22" y="58" width="256" height="125" rx="15" fill="#f8f5f3"/><text x="40" y="87" font-family="Arial" font-size="12" fill="#706c73">security@service-example.co</text><text x="40" y="116" font-family="Arial" font-size="18" font-weight="700" fill="#252329">Verify your account</text><rect x="40" y="137" width="150" height="26" rx="13" fill="#eee6e9"/><text x="115" y="155" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#5a0f1b">SIGN IN NOW</text></g><g transform="translate(410 205)"><path d="M0 100H100" stroke="#8f1725" stroke-width="5"/><circle cx="25" cy="100" r="10" fill="#8f1725" style="animation:scan 3s infinite"/><text x="0" y="60" font-family="Arial" font-size="13" fill="#706c73">inspect</text><text x="0" y="145" font-family="Arial" font-size="15" font-weight="700" fill="#8f1725">Suspicious destination</text></g><g transform="translate(600 185)"><rect width="240" height="230" rx="22" fill="#5a0f1b"/><text x="25" y="42" font-family="Arial" font-size="13" fill="#e8d5d9">SAFER ROUTE</text><text x="25" y="82" font-family="Arial" font-size="20" font-weight="700" fill="white">Open the service</text><text x="25" y="110" font-family="Arial" font-size="20" font-weight="700" fill="white">yourself.</text><circle cx="120" cy="170" r="32" fill="#8f1725" style="animation:pulse 2s infinite"/><path d="M105 170l12 12 24-28" stroke="white" stroke-width="6" fill="none"/></g><text x="55" y="64" fill="#8f1725" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">CS CYBERSAFE LEARN</text></svg>