<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Cybercrime response</title><desc id="d">An unfamiliar account event leads to review, securing the account and reporting.</desc><style>
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes slide{0%{transform:translateX(-30px);opacity:.2}18%,78%{transform:translateX(0);opacity:1}100%{transform:translateX(30px);opacity:.2}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.2}50%{opacity:.85}}
@keyframes scan{0%{transform:translateX(0)}50%{transform:translateX(260px)}100%{transform:translateX(0)}}
@keyframes fill{0%{width:18px}55%{width:210px}100%{width:18px}}
@keyframes swap{0%,20%{transform:translateX(0)}45%,70%{transform:translateX(55px)}100%{transform:translateX(0)}}
@keyframes appear{0%,25%{opacity:0;transform:translateY(10px)}45%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes blink{0%,45%,100%{opacity:.35}55%,85%{opacity:1}}
@keyframes ring{0%{transform:scale(.7);opacity:.7}70%,100%{transform:scale(1.45);opacity:0}}
</style><rect width="900" height="520" rx="30" fill="#f8f5f3"/><circle cx="760" cy="70" r="150" fill="#eee6e9"/><circle cx="120" cy="470" r="180" fill="#f0e7eb"/><text x="55" y="105" fill="#252329" font-family="Arial" font-size="34" font-weight="700">An incident leaves clues.</text><text x="55" y="135" fill="#706c73" font-family="Arial" font-size="16">Notice the event, secure the account and report it.</text><g transform="translate(90 190)"><rect width="720" height="245" rx="24" fill="white" stroke="#e4dcdf"/><circle cx="150" cy="120" r="58" fill="#eee6e9"/><path d="M120 125l25-25 35 40" fill="none" stroke="#5a0f1b" stroke-width="10" stroke-linecap="round"/><text x="150" y="200" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#252329">UNFAMILIAR SIGN-IN</text><path d="M245 120H430" stroke="#c9bdc2" stroke-width="5" stroke-dasharray="10 10"/><g transform="translate(470 65)"><rect width="180" height="110" rx="16" fill="#f8f5f3"/><text x="18" y="35" font-family="Arial" font-size="13" fill="#706c73">Recent activity</text><text x="18" y="63" font-family="Arial" font-size="15" font-weight="700" fill="#5a0f1b">Unknown device</text><text x="18" y="88" font-family="Arial" font-size="12" fill="#706c73">Review • Secure • Report</text></g><circle cx="255" cy="120" r="12" fill="#8f1725" style="animation:glow 2s infinite"/><path d="M255 120H430" stroke="#8f1725" stroke-width="5" stroke-dasharray="1 18"/></g><text x="55" y="64" fill="#8f1725" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">CS CYBERSAFE LEARN</text></svg>